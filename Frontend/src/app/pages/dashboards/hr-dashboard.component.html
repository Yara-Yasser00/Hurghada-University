<app-page-header
  eyebrow="pages.hr.eyebrow"
  title="pages.hr.title"
  subtitle="pages.hr.subtitle"
>
  <button class="primary-button" type="button">
    <svg lucideUserPlus [size]="17"></svg> {{ 'pages.directory.addStaff' | translate }}
  </button>
</app-page-header>

<div class="stats-grid">
  <app-stat-card label="pages.hr.totalEmployees" value="1,086" note="pages.hr.employeesNote" tone="gold">
    <svg icon lucideUsersRound></svg>
  </app-stat-card>
  <app-stat-card label="pages.hr.academicStaff" value="642" note="pages.hr.academicNote">
    <svg icon lucideGraduationCap></svg>
  </app-stat-card>
  <app-stat-card label="pages.hr.openPositions" value="18" note="pages.hr.positionsNote">
    <svg icon lucideUserPlus></svg>
  </app-stat-card>
  <app-stat-card label="pages.hr.payroll" value="EGP 14.2M" note="pages.hr.payrollNote">
    <svg icon lucideWalletCards></svg>
  </app-stat-card>
</div>

<div class="dashboard-grid wide-left">
  <app-panel title="pages.hr.recentHires" subtitle="pages.hr.hiresSub">
    <div class="people-list">
      @for (p of staff(); track p.id; let i = $index) {
        <div>
          <span class="person-avatar" [class.p1]="i === 1" [class.p2]="i === 2" [class.p3]="i === 3">{{ initials(p.name) }}</span>
          <section>
            <strong>{{ p.name }}</strong>
            <small>{{ p.role }} · {{ p.department }}</small>
          </section>
          <app-status>{{ 'common.open' | translate }}</app-status>
        </div>
      }
    </div>
  </app-panel>
  <app-panel title="pages.hr.workforce" subtitle="pages.hr.workforceSub">
    <div class="mix-list">
      @for (row of mix; track row[0]) {
        <div>
          <span><b>{{ row[0] | translate }}</b><small>{{ row[1] }}%</small></span>
          <app-progress [value]="row[1]" />
        </div>
      }
    </div>
  </app-panel>
</div>
