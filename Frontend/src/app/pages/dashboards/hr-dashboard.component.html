<app-page-header
  eyebrow="PEOPLE & CULTURE"
  title="Human resources"
  subtitle="Your people overview, staffing activity and workforce insights."
>
  <button class="primary-button" type="button">
    <svg lucideUserPlus [size]="17"></svg> Add employee
  </button>
</app-page-header>

<div class="stats-grid">
  <app-stat-card label="Total employees" value="1,086" note="+32 this academic year" tone="gold">
    <svg icon lucideUsersRound></svg>
  </app-stat-card>
  <app-stat-card label="Academic staff" value="642" note="59% of workforce">
    <svg icon lucideGraduationCap></svg>
  </app-stat-card>
  <app-stat-card label="Open positions" value="18" note="7 priority vacancies">
    <svg icon lucideUserPlus></svg>
  </app-stat-card>
  <app-stat-card label="Monthly payroll" value="EGP 14.2M" note="Processing on March 25">
    <svg icon lucideWalletCards></svg>
  </app-stat-card>
</div>

<div class="dashboard-grid wide-left">
  <app-panel title="Recent hires" subtitle="Latest additions to the university">
    <div class="people-list">
      @for (p of staff(); track p.id; let i = $index) {
        <div>
          <span class="person-avatar" [class.p1]="i === 1" [class.p2]="i === 2" [class.p3]="i === 3">{{ initials(p.name) }}</span>
          <section>
            <strong>{{ p.name }}</strong>
            <small>{{ p.role }} · {{ p.department }}</small>
          </section>
          <app-status>Onboarded</app-status>
        </div>
      }
    </div>
  </app-panel>
  <app-panel title="Workforce mix" subtitle="By employment category">
    <div class="mix-list">
      @for (row of mix; track row[0]) {
        <div>
          <span><b>{{ row[0] }}</b><small>{{ row[1] }}%</small></span>
          <app-progress [value]="row[1]" />
        </div>
      }
    </div>
  </app-panel>
</div>
